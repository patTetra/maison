<!doctype html>
<html lang="fr">
<head>

<title>Maison · tablette</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#334155;--line:rgba(255,255,255,.12);--text:#f8fafc;--text2:#cbd5e1;--muted:#94a3b8;--muted2:#8d9bb0;--accent:#ec4899;--soft:#ec489926;--aline:#ec489940;--astrong:#ec489980;--green:#4ade80;--red:#ff5a52;--ft:'Rajdhani','Barlow Condensed',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;user-select:none}
svg{flex:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px 20px}
.tabbar{display:flex;padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px);background:rgba(15,23,42,.97);border-top:1px solid var(--aline)}
.tab{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted2);font-size:12px;font-weight:600}
.tab .pill{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.tab.active{color:var(--accent)}.tab.active .pill{background:var(--soft)}
.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin:14px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.sec:first-child{margin-top:0}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.cols{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:900px) and (orientation:landscape){.cols.home{grid-template-columns:400px minmax(0,1fr)}.cols.two{grid-template-columns:1fr 1fr}}
.grid{display:grid;gap:10px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:899px),(orientation:portrait){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.date{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2)}
.clock{font-family:var(--ft);font-size:50px;font-weight:700;line-height:1}
.hdr{display:flex;justify-content:space-between;align-items:flex-end}
.gear{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted2)}
.hero{border-radius:22px;background:linear-gradient(160deg,#2a2347,#1a2236);border:1px solid var(--astrong);padding:16px 20px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.hl{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:var(--text2)}
.temp{font-family:var(--ft);font-size:min(128px,26vw);font-weight:700;line-height:1;margin-top:2px;letter-spacing:-2px}
.temp small{font-size:.36em;color:var(--muted2);font-weight:600;letter-spacing:0}
.chip{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--soft);color:var(--accent);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.chip.g{background:var(--card2);color:var(--muted)}.chip.red{background:rgba(255,90,82,.18);color:var(--red)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.set{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}.set b{font-family:var(--ft);font-size:32px;min-width:84px;text-align:center}.set .lbl{font-size:14px;color:var(--muted)}
.btn{width:46px;height:46px;border-radius:14px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:28px;line-height:1;flex:none}.btn:active{background:var(--accent)}
.spk{margin-top:12px}.spk .cap{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);display:flex;justify-content:space-between}
.spk svg{width:100%;height:70px;display:block}
.tile{padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;position:relative;overflow:hidden;min-height:96px;width:100%}
button.tile{text-align:left}
.hd{display:flex;align-items:center;gap:10px}
.bd{width:42px;height:42px;border-radius:50%;background:var(--card2);color:var(--muted2);display:flex;align-items:center;justify-content:center;flex:none}
.lab{font-size:14px;font-weight:600;color:var(--text2)}.sub{font-size:12px;color:var(--muted)}
.val{margin-top:auto;font-family:var(--ft);font-size:28px;font-weight:700;line-height:1.05;color:var(--text2);padding-top:6px}
.tile.on{background:var(--soft);border-color:var(--astrong)}.tile.on .bd{background:var(--soft);color:var(--accent)}.tile.on .val{color:var(--accent)}
.tile.ok{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.5)}.tile.ok .bd{background:rgba(74,222,128,.2);color:var(--green)}.tile.ok .val{color:var(--green)}
.tile.bad{background:rgba(255,90,82,.14);border-color:rgba(255,90,82,.6)}.tile.bad .bd{background:rgba(255,90,82,.2);color:var(--red)}.tile.bad .val{color:var(--red)}
.tile.na{opacity:.5}
.bar{height:7px;border-radius:4px;background:var(--card2);margin-top:6px;overflow:hidden}.bar u{display:block;height:100%;background:var(--accent)}.tile.ok .bar u{background:var(--green)}
.weather{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:var(--accent)}
.weather .t{font-family:var(--ft);font-size:28px;font-weight:700;color:var(--text)}
.kids{border-radius:16px;border:1px solid var(--line);background:var(--card);overflow:hidden;display:flex;flex-direction:column}
.kids.on{border-color:var(--astrong);background:var(--soft)}
.khd{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%}
.khd .bd{background:var(--soft);color:var(--accent)}.khd>div:nth-child(2){flex:1}.khd .lab{font-size:17px;font-weight:700;color:var(--text)}
.sw{width:50px;height:28px;border-radius:14px;background:var(--card2);position:relative;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}.sw.on{background:var(--accent)}.sw.on::after{left:25px}
.kid{display:flex;align-items:center;gap:10px;padding:7px 12px;margin:0 10px 8px;border-radius:12px;background:rgba(15,23,42,.45);width:calc(100% - 20px)}
.kid.in{background:rgba(74,222,128,.14)}
.av{width:38px;height:38px;border-radius:50%;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--ft);font-size:19px;font-weight:700;flex:none;position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.kid.off .av{background:var(--card2);color:var(--muted);filter:grayscale(1)}
.kn{font-family:var(--ft);font-size:20px;font-weight:700;flex:1;min-width:0}.kt{font-size:12px;color:var(--muted)}.kt b{color:var(--green);font-size:15px}.kid.off .kt b{color:var(--muted)}
.kb{font-size:12px;font-weight:700;min-width:30px;text-align:center;color:var(--accent)}.kid.in .kb{color:var(--green)}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:12px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;font-weight:600;color:var(--text2)}.seg button.on{background:var(--soft);border-color:var(--astrong);color:var(--accent)}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.row .lab{flex:1}.row b{font-family:var(--ft);font-size:26px;min-width:76px;text-align:center}
.days{display:flex;gap:6px}.days button{flex:1;padding:12px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;font-weight:700;color:var(--muted)}.days button.on{background:var(--soft);border-color:var(--astrong);color:var(--accent)}
.cams{display:grid;gap:10px;grid-template-columns:1fr 1fr}.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line);aspect-ratio:16/9}.cam.wide,.cams .kids{grid-column:1/-1}.cams .kids{align-self:start}
@media (min-width:900px) and (orientation:landscape){.cams{grid-template-columns:repeat(4,minmax(0,1fr))}.cam.wide{grid-column:span 2}.cam{grid-column:span 1}.cams .kids{grid-column:span 2}}.cam img{width:100%;height:100%;object-fit:cover;display:block}.cam .cn{position:absolute;left:10px;top:8px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(15,23,42,.7)}.cam .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.setup{max-width:520px;margin:40px auto;display:flex;flex-direction:column;gap:12px}.setup h1{font-family:var(--ft);font-size:34px;margin:0}.setup input{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;width:100%}.setup .go{padding:14px;border-radius:12px;background:var(--accent);text-align:center;font-weight:700}
.status{position:fixed;top:8px;right:12px;font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(255,176,32,.16);color:#ffb020;z-index:5}

</style>
</head>
<body>
<div id="app"><main id="main"></main><nav class="tabbar" id="tabbar"></nav></div>
<script>
(function (M) {
  'use strict';

  // Toutes les entités Home Assistant utilisées par l'app (issues du tableau de bord J.A.R.V.I.S.)
  const E = {
    weather: 'weather.forecast_maison',
    salonTemp: 'sensor.bthome_sensor_cb2e_temperature',
    power: 'sensor.lixee_zlinky_tic_puissance_apparente',

    tmaxJour: 'sensor.plo_max_du_jour',
    confortJour: 'input_number.temp_confort_jour',
    ecoNuit: 'input_number.temp_eco_nuit',
    debutJour: 'input_datetime.heure_debut_jour',
    debutNuit: 'input_datetime.heure_debut_nuit',
    hysteresis: 'input_number.chauffage_hysteresis',
    ballon: 'switch.shelly1_e8db84d684f4',
    ballonForce: 'input_boolean.chauffe_eau_force',
    filtration: 'switch.switch_filtration',
    filtrationTemp: 'sensor.switch_filtration_temperature',
    modeEnfant: 'input_boolean.mode_enfant',
    jourNuit: 'input_boolean.etat_jour_nuit',
    lumExt: 'light.lumieres_exterieures',
    borne: 'switch.borne_tesla_switch',
    debutRecharge: 'input_datetime.debut_recharge_tesla',
    finRecharge: 'input_datetime.fin_recharge_tesla',
    courantRecharge: 'number.tesla_model_y_courant_de_recharge',
    teslaEnergie: 'sensor.consommation_tesla_channel_1_energie',
    teslaIdx6: 'input_number.tesla_index_6h',
    teslaIdx22: 'input_number.tesla_index_22h',
    teslaCouleurCycle: 'input_text.tesla_couleur_cycle',
    edfTempo: 'sensor.couleur_du_jour',
    teslaKwhDernier: 'input_number.tesla_kwh_dernier',
    teslaCoutDernier: 'input_number.tesla_cout_dernier',
    teslaCouleurDernier: 'input_text.tesla_couleur_dernier',
    teslaKwhMois: 'input_number.tesla_kwh_mois',
    teslaCoutMois: 'input_number.tesla_cout_mois',
    tvEnergie: 'sensor.shellyplugmg3_d885ac176d60_energie',
    tvKwhDernier: 'input_number.tv_kwh_dernier',
    tvCoutDernier: 'input_number.tv_cout_dernier',

    enfantPres3: 'input_boolean.presence_enfant3',
    chauffageMode: 'input_select.chauffage_mode',

    teslaBatt: 'sensor.tesla_model_y_niveau_de_la_batterie',
    teslaCharge: 'sensor.tesla_model_y_charge',
    teslaInside: 'sensor.tesla_model_y_temperature_interieure',
    reveil: 'input_datetime.reveil_chambre',
    reveilActif: 'input_boolean.reveil_chambre_actif',
    mower: 'lawn_mower.tondeuse',
    mowerCharging: 'binary_sensor.luba_vp7yma7u_en_charge',

    tvPower: 'sensor.shellyplugmg3_d885ac176d60_puissance',
    calendar: 'calendar.tmbb',
    planning: 'calendar.planning_patrick'
  };

  const DAYS = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'].map(function (d) {

  const TEMPO = [
    ['Bleu HP', 'input_number.tarif_tempo_bleu_hp'],
    ['Bleu HC', 'input_number.tarif_tempo_bleu_hc'],
    ['Blanc HP', 'input_number.tarif_tempo_blanc_hp'],
    ['Blanc HC', 'input_number.tarif_tempo_blanc_hc'],
    ['Rouge HP', 'input_number.tarif_tempo_rouge_hp'],
    ['Rouge HC', 'input_number.tarif_tempo_rouge_hc']
  ].map(function (t) { return { name: t[0], entity: t[1] }; });

  // Capteurs d'ouverture (Aqara) : état "on" = porte ouverte
  const DOORS = [
    { name: "Porte d'entrée", entity: 'binary_sensor.lumi_cn_lumi_158d0001ab3e4e_aq2_contact_state_p_2_1' },
    { name: 'Chambre parents', entity: 'binary_sensor.lumi_cn_lumi_158d0001dad253_aq2_contact_state_p_2_1' },
    { name: 'WC', entity: 'binary_sensor.lumi_cn_lumi_158d0001dad637_aq2_contact_state_p_2_1' }
  ];

  const LIGHTS_IN = [
    { name: 'Salon', entity: 'light.shelly1g3_e4b063eacb60' },
    { name: 'Entrée', entity: 'input_boolean.lumieres_entree_virtuelle' },
    { name: 'Cuisine', entity: 'switch.shelly1_483fda829e7e' },
    { name: 'Épicerie', entity: 'light.epicerie' },
    { name: 'Chambre parents', entity: 'light.lumiere_chambre_parents' },
    { name: 'Bar', entity: 'light.lumieres_bar' },
    { name: 'Toilettes', entity: 'light.yeelight_color_0x3720fa5' }
  ];

  const LIGHTS_OUT = [

    { name: 'Carport', entity: 'light.lumiere_carport' },

    { name: 'Projecteur parking', entity: 'light.camera_parking_floodlight_timed' },
    { name: 'Projecteur terrasse', entity: 'light.terrasse_floodlight_timed' }
  ];

  // « Portail » filme le portail ; « Entrée » (caméra de la terrasse) filme la porte d'entrée
  const CAMERAS = [
    { name: 'Entrée', entity: 'camera.terrasse_hd_stream', wide: true, every: 1000 },
    { name: 'Parking', entity: 'camera.camera_parking_hd_stream', wide: true, every: 3000 },
    { name: 'Portail', entity: 'camera.entree', wide: false, every: 10000 },
    { name: 'Grange', entity: 'camera.ipcam_mainprofile', wide: false, every: 10000 }
  ];

  // Autres prises pilotables depuis l'onglet Lumières (hors décompte « lumières allumées »)
  const OTHERS = [{ name: 'Télé', entity: E.tv, icon: 'tv' }];

  const ALL_LIGHTS = LIGHTS_IN.concat(LIGHTS_OUT).map(function (l) { return l.entity; });

  const all = [];
  Object.keys(E).forEach(function (k) { if (k !== 'calendar' && k !== 'planning' && E[k]) all.push(E[k]); });
  DAYS.concat(TEMPO, DOORS, LIGHTS_IN, LIGHTS_OUT).forEach(function (x) { all.push(x.entity); });
  const ALL_ENTITIES = all.filter(function (v, i) { return all.indexOf(v) === i; });

  M.E = E;
  M.DAYS = DAYS;
  M.TEMPO = TEMPO;
  M.DOORS = DOORS;
  M.LIGHTS_IN = LIGHTS_IN;
  M.LIGHTS_OUT = LIGHTS_OUT;
  M.CAMERAS = CAMERAS;
  M.OTHERS = OTHERS;
  M.ALL_LIGHTS = ALL_LIGHTS;
  M.ALL_ENTITIES = ALL_ENTITIES;
})(window.M = window.M || {});

(function (M) {
  'use strict';

  // Même clé que l'app Tesla : l'adresse et le jeton sont partagés avec l'onglet Voiture
  var KEY = 'ha-config';

  function readJson(k) {
    try { return JSON.parse(localStorage.getItem(k) || '{}') || {}; } catch (e) { return {}; }
  }

  var HA = M.HA = {
    baseUrl: '', token: '', store: {}, status: 'idle',
    ws: null, msgId: 0, pending: {}, subId: null, failCount: 0,
    wantConnect: false, pollTimer: null, reconnectTimer: null,
    listeners: [], statusListeners: []

    var c = readJson(KEY);

  };

  HA.saveConfig = function (baseUrl, token) {
    var c = readJson(KEY);
    c.baseUrl = String(baseUrl || '').trim().replace(/\/+$/, '');

    localStorage.setItem(KEY, JSON.stringify(c));
    HA.loadConfig();
  };

  HA.configured = function () { return !!(HA.baseUrl && HA.token); };

  // ---------- Lecture de l'état ----------
  HA.s = function (id) { var o = HA.store[id]; return o ? o.state : undefined; };
  HA.a = function (id, k) { var o = HA.store[id]; return o && o.attributes ? o.attributes[k] : undefined; };
  HA.isOn = function (id) { return HA.s(id) === 'on'; };
  HA.avail = function (id) { var s = HA.s(id); return s !== undefined && s !== 'unavailable' && s !== 'unknown'; };
  HA.num = function (id) {
    var s = HA.s(id);
    if (s === undefined || s === 'unavailable' || s === 'unknown') return null;
    var v = parseFloat(s);
    return isNaN(v) ? null : v;
  };

  HA.onChange = function (cb) { HA.listeners.push(cb); };
  HA.onStatus = function (cb) { HA.statusListeners.push(cb); };

  function setStatus(s) {
    if (HA.status === s) return;
    HA.status = s;
    HA.statusListeners.forEach(function (f) { try { f(s); } catch (e) { console.error(e); } });
  }

  var pendingIds = {}, scheduled = false;
  function notify(ids) {
    (ids || []).forEach(function (i) { pendingIds[i] = true; });
    if (scheduled) return;
    scheduled = true;
    setTimeout(function () {
      scheduled = false;
      var arr = Object.keys(pendingIds);
      pendingIds = {};
      saveCache();
      HA.listeners.forEach(function (f) { try { f(arr); } catch (e) { console.error(e); } });
    }, 150);
  }

  // ---------- REST ----------
  HA.rest = async function (path, opts) {
    opts = opts || {};
    if (!HA.configured()) throw new Error('Home Assistant non configuré');
    var headers = Object.assign({ 'Authorization': 'Bearer ' + HA.token, 'Content-Type': 'application/json' }, opts.headers || {});
    var res = await fetch(HA.baseUrl + path, Object.assign({}, opts, { headers: headers }));
    if (!res.ok) {
      var d = '';
      try { d = (await res.text()).slice(0, 160); } catch (e) { /* rien */ }
      throw new Error('HA ' + res.status + (d ? ' — ' + d : ''));
    }
    var t = await res.text();
    return t ? JSON.parse(t) : null;
  };

  HA.call = function (domain, service, data) {
    return HA.rest('/api/services/' + domain + '/' + service, { method: 'POST', body: JSON.stringify(data || {}) });
  };

  // Appel de service ; si le temps réel n'est pas actif, on relit l'état juste après
  HA.act = async function (domain, service, data, ids) {
    await HA.call(domain, service, data);

  function schedule() { if (rt) return; rt = setTimeout(function () { rt = null; render(); }, 200); }
  function go(v) {
    if (v === view) return; view = v; stopCams(); render(); $('main').scrollTop = 0;
    if (v === 'cams') startCams();
    try { history.replaceState(null, '', '#' + v); } catch (e) { /* rien */ }
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-t],[data-go],[data-st],[data-kid],[data-mode],[data-off],#cg'); if (!t) return;
    if (t.id === 'cg') { HA.saveConfig($('cu').value, $('ct').value); HA.reconnect(); view = 'home'; render(); return; }
    if (t.dataset.go) { go(t.dataset.go); return; }
    if (t.dataset.t) { toggle(t.dataset.t); return; }
    if (t.dataset.st) { var p = t.dataset.st.split('|'); step(p[0], Number(p[1]), p[2]); return; }
    if (t.dataset.kid) { pointage(Number(t.dataset.kid)); return; }
    if (t.dataset.mode) { HA.act('input_select', 'select_option', { entity_id: E.chauffageMode, option: t.dataset.mode }, [E.chauffageMode]); return; }
    if (t.dataset.off) { HA.act('homeassistant', 'turn_off', { entity_id: M.ALL_LIGHTS }, M.ALL_LIGHTS); }
  });

  // Historique du salon (24 h) pour la courbe
  function loadHist() {
    if (!HA.configured()) return;
    var start = new Date(Date.now() - 24 * 3600 * 1000).toISOString();
    HA.rest('/api/history/period/' + start + '?filter_entity_id=' + E.salonTemp + '&minimal_response&no_attributes').then(function (r) {
      var a = (r && r[0] || []).map(function (x) { return [new Date(x.last_changed || x.last_updated).getTime(), parseFloat(x.state)]; }).filter(function (x) { return !isNaN(x[1]); });
      if (a.length < 2) return;
      var t0 = Date.now() - 24 * 3600 * 1000, vs = a.map(function (x) { return x[1]; });
      histMin = Math.min.apply(null, vs); histMax = Math.max.apply(null, vs);
      var lo = histMin - 0.3, hi = histMax + 0.3, W = 300, H = 70;
      var pts = a.map(function (x) { return [Math.max(0, (x[0] - t0) / (24 * 3600 * 1000)) * W, H - (x[1] - lo) / (hi - lo) * (H - 6) - 3]; });
      var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
      histSvg = '<svg viewBox="0 0 300 70" preserveAspectRatio="none"><defs><linearGradient id="hg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ec4899" stop-opacity=".4"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></linearGradient></defs><path d="' + line + ' L300 70 L' + pts[0][0].toFixed(1) + ' 70Z" fill="url(#hg)"/><path d="' + line + '" fill="none" stroke="#ec4899" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>';
      schedule();
    }).catch(function () { /* ignoré */ });
  }

  // Mode enfant : caméras automatiquement, retour à l'accueil quand il s'arrête
  var lastMode = null;
  function modeWatch() {
    var m = HA.s(E.modeEnfant); if (m === undefined) return;
    if (lastMode !== null && m !== lastMode) { if (m === 'on') go('cams'); else if (view === 'cams') go('home'); }
    lastMode = m;
  }

  function boot() {
    HA.loadConfig(); if (M.loadCfg) M.loadCfg(); HA.loadCache();
    var h = (location.hash || '').replace('#', ''); if (VIEWS[h]) view = h;
    render(); if (view === 'cams') startCams();
    HA.onChange(function () { modeWatch(); schedule(); });
    HA.onStatus(function (s) { var el = document.getElementById('st'); if (!el) { el = document.createElement('div'); el.id = 'st'; el.className = 'status'; document.body.appendChild(el); } el.style.display = s === 'connected' ? 'none' : ''; el.textContent = s === 'connected' ? '' : 'Connexion…'; });
    if (HA.configured()) { HA.connect(); loadHist(); setInterval(loadHist, 300000); }
    setInterval(function () { var c = $('ck'); if (c) c.textContent = clock(); var d = $('dt'); if (d) d.textContent = dayStr(); }, 15000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) { if (view === 'cams') startCams(); HA.reconnect && HA.reconnect(); } });
    setTimeout(function () { if (HA.s(E.modeEnfant) === 'on' && lastMode === null) { lastMode = 'on'; go('cams'); } else modeWatch(); }, 1500);
  }
  boot();
})(window.M = window.M || {});

</script>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maison">
<meta name="theme-color" content="#050b10">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Maison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --bg:#050b10; --card:#0c1a22; --card2:#17303b; --line2:#1b3440;
  --text:#e6f6fa; --text2:#b4cdd4; --muted:#9bbcc5; --muted2:#8fb0b9;
  --warn:#ffb020; --danger:#ff5a52;
  --accent:#22d3ee; --accent-soft:#22d3ee26; --accent-line:#22d3ee40; --accent-strong:#22d3ee80;
  --ft:'Rajdhani',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit;-webkit-touch-callout:none;user-select:none}
input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
svg{flex:none}

#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--bg)}
.views{flex:1;position:relative;overflow:hidden;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 28px;display:none}
.view.active{display:block}
.view.frameview{padding:0;overflow:hidden}
.view.frameview iframe{width:100%;height:100%;border:0;display:block;background:#101214}
.stack{display:flex;flex-direction:column;gap:14px}

.tabbar{display:flex;padding:8px 2px calc(env(safe-area-inset-bottom,0px) + 8px);background:rgba(5,11,16,.96);border-top:1px solid var(--accent-line)}
.tab{flex:1;min-height:50px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted2)}
.tab .pill{width:46px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.tab span{font-size:11px;font-weight:600}
.tab.active{color:var(--accent)}
.tab.active .pill{background:var(--accent-soft)}

.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.dateline{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)}
.hello{margin-top:2px;font-family:var(--ft);font-size:34px;line-height:1;font-weight:700}
.stat{font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:rgba(255,176,32,.14);color:var(--warn);white-space:nowrap}
.stat.err{background:rgba(255,90,82,.14);color:var(--danger)}

.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.4);font-size:14px}
.banner span{flex:1}

.shortcuts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sc{height:72px;padding:8px;border-radius:16px;background:var(--card);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text2);font-size:13px;font-weight:600;text-align:center}
.sc svg{color:var(--muted2)}
.sc.on{background:var(--accent-soft);border-color:var(--accent-strong);color:var(--text)}
.sc.on svg{color:var(--accent)}

.power{display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;border-radius:16px;background:var(--card);border:1px solid var(--accent-line);width:100%}
.pw-l{flex:1;font-size:14px;font-weight:500;color:var(--text2)}
.pw-v{font-family:var(--ft);font-size:24px;font-weight:700}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{min-height:92px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;color:inherit}
.tile.lt{min-height:78px}
.tile.wide{grid-column:1/-1}
.tile.na{opacity:.5}
.tile-top{display:flex;align-items:center;gap:8px;width:100%;color:var(--muted2)}
.tile-lab{flex:1;font-size:13px;font-weight:600;color:var(--text2)}
.tile-val{margin-top:4px;font-family:var(--ft);font-size:24px;font-weight:700;line-height:1.1;color:var(--text2)}
.tile-sub{font-size:12px;color:var(--muted)}
.tile.on{background:var(--accent-soft);border-color:var(--accent-strong)}
.tile.on .tile-top>svg:first-child,.tile.on .tile-val{color:var(--accent)}
.tile.warn{background:rgba(255,176,32,.12);border-color:rgba(255,176,32,.45)}
.tile.warn .tile-top>svg:first-child,.tile.warn .tile-val{color:var(--warn)}

.acc{border-radius:20px;background:var(--card);border:1px solid var(--accent-line);overflow:hidden}
.acc-head{width:100%;height:56px;padding:0 14px;display:flex;align-items:center;gap:12px;color:inherit}
.acc-ic{width:36px;height:36px;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.acc-t{flex:none;font-family:var(--ft);font-size:20px;font-weight:600;white-space:nowrap}
.acc-s{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .chev{color:var(--accent);transition:transform .2s;display:flex}
.acc.open .chev{transform:rotate(180deg)}
.acc-body{padding:0 14px 8px}
.evt{display:flex;align-items:center;gap:14px;min-height:38px;border-top:1px solid var(--card2);padding:4px 0}
.evt-t{width:58px;flex:none;font-family:var(--ft);font-size:18px;font-weight:700;color:var(--accent)}
.evt-n{flex:1;font-size:14px;font-weight:500}
.evt-n small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.hw{padding:6px 0;border-top:1px solid var(--card2);font-size:14px}
.hw b{font-weight:600}
.hw span{display:block;font-size:12px;color:var(--muted)}
.empty{padding:10px 0;font-size:13px;color:var(--muted);border-top:1px solid var(--card2)}

.sec{margin:6px 0 0;font-family:var(--ft);font-size:20px;font-weight:600;display:flex;align-items:baseline;justify-content:space-between}
.sec small{font-size:13px;color:var(--muted);font-weight:400;font-family:'Barlow',sans-serif}
.hint{font-size:12px;color:var(--muted);line-height:1.4}
.pg-sub{font-size:13px;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--accent-line);border-radius:20px;padding:14px}
.card h2{font-family:var(--ft);font-size:20px;font-weight:600;display:flex;justify-content:space-between;align-items:center;min-height:36px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;border-top:1px solid var(--card2);font-size:14px}
.card h2+.row{margin-top:6px}
.row>span:first-child{color:var(--text2)}
.row .big{font-family:var(--ft);font-size:22px;font-weight:700}
.row .val{color:var(--muted);text-align:right}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:rgba(255,176,32,.14);color:var(--warn)}
.chip.off{background:var(--card2);color:var(--muted)}
.subhead{width:100%;min-height:44px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--card2);font-size:14px;color:var(--accent);font-weight:600}
.subhead .chev{display:flex;transition:transform .2s}
.subhead.open .chev{transform:rotate(180deg)}

.sw{width:52px;height:30px;border-radius:15px;background:var(--card2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:var(--muted2);transition:transform .2s,background .2s}
.sw.on{background:var(--accent-strong)}
.sw.on::after{transform:translateX(22px);background:var(--accent)}
.sw.danger.on{background:rgba(255,90,82,.5)}
.sw.danger.on::after{background:var(--danger)}
.stepper{display:flex;align-items:center;gap:6px}
.sb{width:44px;height:44px;border-radius:12px;border:1px solid var(--accent-line);color:var(--accent);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center}
.sv{min-width:70px;text-align:center;font-family:var(--ft);font-size:20px;font-weight:700}
.sv small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.days{display:flex;gap:6px;padding:8px 0 4px}
.day{flex:1;text-align:center;height:44px;border-radius:12px;background:var(--card2);color:var(--muted);font-weight:700}
.day.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-strong)}
.inp{height:44px;width:100%;border-radius:12px;border:1px solid var(--line2);background:var(--card2);padding:0 12px;color:var(--text);font-size:16px}
.inp.sm{width:112px;text-align:center}
.field{margin-top:12px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px}
.note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
.opts{display:flex;gap:8px}
.opt{flex:1;height:44px;border-radius:12px;border:1px solid var(--line2);color:var(--text2);font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center}
.opt.on{background:var(--accent-soft);border-color:var(--accent-strong);color:var(--accent)}
.swatches{display:flex;gap:10px}
.swatch{width:44px;height:44px;border-radius:22px;border:2px solid transparent}
.swatch.on{border-color:var(--text)}
.msg{margin-top:10px;font-size:13px;font-weight:600}
.msg.ok{color:var(--accent)}
.msg.ko{color:var(--danger)}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btnrow .btn{flex:1}

.btn{height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--accent-strong);color:var(--accent);font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.solid{background:var(--accent);color:#031116;border-color:var(--accent)}
.btn.danger{border-color:rgba(255,90,82,.6);color:var(--danger)}
.btn.wide{width:100%;margin:8px 0 6px}

.cams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cam{position:relative;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--accent-line);aspect-ratio:16/9;display:block;width:100%}
.cam.wide{grid-column:1/-1}
.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cam img:not([src]){visibility:hidden}
.cam .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.cam .ph[hidden]{display:none}
.cam .lab{position:absolute;left:10px;bottom:8px;font-size:13px;font-weight:600;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}

.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);border-top:1px solid var(--accent-line);border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(105%);transition:transform .25s;z-index:41;max-height:80vh;overflow-y:auto}
.sheet.show{transform:none}
.sheet-handle{width:46px;height:4px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.sheet h3{font-family:var(--ft);font-size:22px;font-weight:600;margin-bottom:6px}
.dim-val{font-family:var(--ft);font-size:44px;font-weight:700;color:var(--accent);margin:6px 0}
.range{width:100%;accent-color:var(--accent);height:44px}

.overlay{position:fixed;inset:0;max-width:480px;margin:0 auto;background:var(--bg);z-index:50;display:none;flex-direction:column}
.overlay.show{display:flex}
.ov-bar{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;border-bottom:1px solid var(--accent-line)}
.ov-back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.ov-title{font-family:var(--ft);font-size:20px;font-weight:600}
.ov-body{flex:1;min-height:0;display:flex;flex-direction:column}
.ov-frame{flex:1;width:100%;border:0;background:#fff}
.camfull{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
.camfull video,.camfull img{width:100%;max-height:100%;object-fit:contain}
.camfull [hidden]{display:none}
.camnote{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);text-align:center;font-size:13px;color:var(--muted)}

.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);max-width:448px;margin:0 auto;background:var(--card2);border:1px solid var(--accent-line);border-radius:14px;padding:12px 14px;font-size:14px;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s;z-index:60}
.toast.show{opacity:1;transform:none}

:root{--light:#ff8a3d}
.tile.on.lit{background:rgba(255,138,61,.14);border-color:rgba(255,138,61,.55)}
.tile.on.lit .tile-top>svg:first-child,.tile.on.lit .tile-val{color:var(--light)}
.sc.on.lit{background:rgba(255,138,61,.14);border-color:rgba(255,138,61,.55)}
.sc.on.lit svg{color:var(--light)}
.dim-val{color:var(--light)}
.range{accent-color:var(--light)}
.evt-t small{display:block;font-family:'Barlow',sans-serif;font-size:12px;font-weight:500;color:var(--muted);line-height:1.1}
.evt{min-height:46px}
.pel-val{font-family:var(--ft);font-size:44px;font-weight:700;color:var(--accent);margin:4px 0 8px}
.pel-val small{font-size:16px;font-weight:500;color:var(--muted)}
.btn[disabled]{opacity:.5;pointer-events:none}
.tile.wide{min-height:78px}
.row2{display:grid;grid-template-columns:2fr 3fr;gap:10px}
.tile-in{font-size:12px;font-weight:500;color:var(--muted)}
.bar{width:100%;height:10px;border-radius:5px;background:var(--card2);margin-top:auto;padding:0;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.bar.chg i{background:#1fd68a}
.bar.low i{background:var(--warn)}
.row2 .tile{min-height:92px}
.barrow{display:flex;align-items:center;gap:10px;width:100%;margin-top:auto}
.barrow .bar{flex:1;margin-top:0}
.barpct{font-family:var(--ft);font-size:18px;font-weight:700;color:var(--text2)}

</style>
</head>
<body>
<div id="app">
  <main class="views" id="views"></main>
  <nav class="tabbar" id="tabbar" aria-label="Navigation"></nav>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog"></div>
<div class="overlay" id="overlay"></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function (M) {
  'use strict';

  // Toutes les entités Home Assistant utilisées par l'app (issues du tableau de bord J.A.R.V.I.S.)
  const E = {
    weather: 'weather.forecast_maison',
    salonTemp: 'sensor.bthome_sensor_cb2e_temperature',
    power: 'sensor.lixee_zlinky_tic_puissance_apparente',
    powerMax: 'input_number.seuil_puissance_max',
    powerMin: 'input_number.seuil_puissance_min',
    poele: 'switch.poele',
    consigne: 'input_number.temp_desiree_direct',
    maintenance: 'input_boolean.maintenance_poele',
    tmaxJour: 'sensor.plo_max_du_jour',
    confortJour: 'input_number.temp_confort_jour',
    ecoNuit: 'input_number.temp_eco_nuit',
    debutJour: 'input_datetime.heure_debut_jour',
    debutNuit: 'input_datetime.heure_debut_nuit',
    hysteresis: 'input_number.chauffage_hysteresis',
    ballon: 'switch.shelly1_e8db84d684f4',
    ballonForce: 'input_boolean.chauffe_eau_force',
    filtration: 'switch.switch_filtration',
    filtrationTemp: 'sensor.switch_filtration_temperature',
    modeEnfant: 'input_boolean.mode_enfant',
    jourNuit: 'input_boolean.etat_jour_nuit',
    lumExt: 'light.lumieres_exterieures',
    borne: 'switch.borne_tesla_switch',
    debutRecharge: 'input_datetime.debut_recharge_tesla',
    finRecharge: 'input_datetime.fin_recharge_tesla',
    courantRecharge: 'number.tesla_model_y_courant_de_recharge',
    teslaBatt: 'sensor.tesla_model_y_niveau_de_la_batterie',
    teslaCharge: 'sensor.tesla_model_y_charge',
    teslaInside: 'sensor.tesla_model_y_temperature_interieure',
    mower: 'lawn_mower.tondeuse',
    mowerCharging: 'binary_sensor.luba_vp7yma7u_en_charge',
    mowerBatt: 'sensor.tondeuse_batterie',
    mowerProgress: 'sensor.tondeuse_progression',
    teslaTemps: 'sensor.tesla_model_y_temps_avant_la_charge_complete',
    tv: 'switch.shellyplugmg3_d885ac176d60',
    tvPower: 'sensor.shellyplugmg3_d885ac176d60_puissance',
    calendar: 'calendar.tmbb'
  };

  const DAYS = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'].map(function (d) {
    return { letter: d.charAt(0).toUpperCase(), name: d, entity: 'input_boolean.chauffe_eau_' + d };
  });

  const TEMPO = [
    ['Bleu HP', 'input_number.tarif_tempo_bleu_hp'],
    ['Bleu HC', 'input_number.tarif_tempo_bleu_hc'],
    ['Blanc HP', 'input_number.tarif_tempo_blanc_hp'],
    ['Blanc HC', 'input_number.tarif_tempo_blanc_hc'],
    ['Rouge HP', 'input_number.tarif_tempo_rouge_hp'],
    ['Rouge HC', 'input_number.tarif_tempo_rouge_hc']
  ].map(function (t) { return { name: t[0], entity: t[1] }; });

  // Capteurs d'ouverture (Aqara) : état "on" = porte ouverte
  const DOORS = [
    { name: "Porte d'entrée", entity: 'binary_sensor.lumi_cn_lumi_158d0001ab3e4e_aq2_contact_state_p_2_1' },
    { name: 'Chambre parents', entity: 'binary_sensor.lumi_cn_lumi_158d0001dad253_aq2_contact_state_p_2_1' },
    { name: 'WC', entity: 'binary_sensor.lumi_cn_lumi_158d0001dad637_aq2_contact_state_p_2_1' }
  ];

  const LIGHTS_IN = [
    { name: 'Salon', entity: 'light.shelly1g3_e4b063eacb60' },
    { name: 'Entrée', entity: 'input_boolean.lumieres_entree_virtuelle' },
    { name: 'Cuisine', entity: 'switch.shelly1_483fda829e7e' },
    { name: 'Épicerie', entity: 'light.epicerie' },
    { name: 'Chambre parents', entity: 'light.lumiere_chambre_parents' },
    { name: 'Bar', entity: 'light.lumieres_bar' },
    { name: 'Toilettes', entity: 'light.yeelight_color_0x3720fa5' }
  ];

  const LIGHTS_OUT = [
    { name: 'Extérieures', entity: 'light.lumieres_exterieures' },
    { name: 'Dehors', entity: 'light.dehors' },
    { name: 'Plancha', entity: 'light.plancha' },
    { name: 'Guirlande terrasse', entity: 'light.guirlande_terrasse' },
    { name: 'Carport', entity: 'light.lumiere_carport' },
    { name: 'Entrée ext.', entity: 'light.lumiere_exterieur_entree' },
    { name: 'Portail', entity: 'light.lumiere_exterieur_portail' },
    { name: 'Projecteur parking', entity: 'light.camera_parking_floodlight_timed' },
    { name: 'Projecteur terrasse', entity: 'light.terrasse_floodlight_timed' }
  ];

  // « Portail » filme le portail ; « Entrée » (caméra de la terrasse) filme la porte d'entrée
  const CAMERAS = [
    { name: 'Portail', entity: 'camera.entree', wide: false },
    { name: 'Entrée', entity: 'camera.terrasse_hd_stream', wide: false },
    { name: 'Parking', entity: 'camera.camera_parking_hd_stream', wide: true },
    { name: 'Grange', entity: 'camera.ipcam_mainprofile', wide: true }
  ];

    h += '<div class="card"><h2>Couleur</h2><div class="swatches" style="margin-top:8px">' +
      COLORS.map(function (col) { return '<button class="swatch' + (col === c.accent ? ' on' : '') + '" data-col="' + col + '" style="background:' + col + '" aria-label="' + col + '"></button>'; }).join('') +
      '</div></div>';

    h += '<div class="card"><h2>Données locales</h2><div class="note">Efface l\'adresse, le jeton et les réglages enregistrés sur cet appareil.</div>' +
      '<div class="btnrow"><button class="btn danger" id="s-reset">Tout effacer</button></div></div>';
    h += '<div class="hint">Maison · pattetra.github.io/maison</div></div>';

    el.innerHTML = h;

    el.querySelector('#s-save').onclick = async function () {
      var url = el.querySelector('#s-url').value.trim();
      var tok = el.querySelector('#s-tok').value.trim();
      if (!/^https?:\/\//.test(url)) { testMsg = { cls: 'ko', text: "L'adresse doit commencer par https://" }; render(); return; }
      HA.saveConfig(url, tok);
      testMsg = { cls: '', text: 'Test en cours…' };
      el.querySelector('#s-msg').textContent = testMsg.text;
      try {
        await HA.rest('/api/');
        testMsg = { cls: 'ok', text: 'Connexion réussie' };
        HA.store = {};
        HA.reconnect();
        M.school.load();
        M.loadAgenda(true);
      } catch (e) {
        var m = String(e.message || e);
        testMsg = { cls: 'ko', text: /401|403/.test(m) ? 'Jeton refusé' : /Failed to fetch|Load failed|NetworkError/i.test(m) ? 'Adresse injoignable ou accès refusé (CORS : ajoute https://pattetra.github.io dans cors_allowed_origins)' : m };
      }
      render();
    };
    el.querySelectorAll('[data-jn]').forEach(function (b) {
      b.onclick = function () { M.saveCfg({ jourQuandActive: b.dataset.jn === '1' }); render(); };
    });
    el.querySelectorAll('[data-col]').forEach(function (b) {
      b.onclick = function () { M.saveCfg({ accent: b.dataset.col }); M.applyAccent(); render(); };
    });
    el.querySelector('#s-sch-save').onclick = function () {
      M.saveCfg({ scheduleUrl: el.querySelector('#s-sch').value.trim(), ecoleUrl: el.querySelector('#s-eco').value.trim() });
      M.school.load();
      M.toast('Enregistré');
    };
    el.querySelector('#s-pel-save').onclick = function () {
      M.saveCfg({
        pelletRepo: el.querySelector('#s-prepo').value.trim(),
        pelletPath: el.querySelector('#s-ppath').value.trim(),
        pelletToken: el.querySelector('#s-ptok').value.trim()
      });
      M.pellets.refresh();
      M.toast('Enregistré');
    };
    el.querySelector('#s-reset').onclick = function () {
      if (!confirm('Effacer toutes les données locales ?')) return;
      try { localStorage.removeItem('ha-config'); localStorage.removeItem('maison-config'); localStorage.removeItem('maison-pellets'); localStorage.removeItem('maison-cache'); } catch (e) { /* rien */ }
      location.reload();
    };
    el.scrollTop = top;
  }

  M.registerView('reglages', { render: render, live: false, onShow: function () { testMsg = null; render(); } });
  HA.onStatus(function () { if (M.current === 'reglages' && !testMsg) render(); });
})(window.M = window.M || {});

(function (M) {
  'use strict';
  var HA = M.HA;

  M.current = null;

  var TABS = [
    ['accueil', 'Accueil', 'home'],
    ['lumieres', 'Lumières', 'bulb'],
    ['cameras', 'Caméras', 'camera'],
    ['maison', 'Maison', 'grid'],
    ['voiture', 'Voiture', 'car'],
    ['reglages', 'Réglages', 'gear']
  ];

  // Voiture = ton app Tesla, chargée telle quelle dans un cadre
  M.registerView('voiture', {
    frame: true,
    live: false,
    render: function () {},
    onShow: function () {
      var v = M.views.voiture;
      if (!v.el.firstChild) {
        v.el.innerHTML = '<iframe src="voiture.html" title="Voiture"></iframe>';
      }
    }
  });

  M.go = function (name) {
    if (!M.views[name] || M.current === name) {
      if (M.views[name] && M.views[name].render) M.views[name].render();
      return;
    }
    var prev = M.views[M.current];
    if (prev && prev.onHide) prev.onHide();
    M.current = name;
    TABS.forEach(function (t) {
      var v = M.views[t[0]];
      v.el.classList.toggle('active', t[0] === name);
      v.tab.classList.toggle('active', t[0] === name);
      v.tab.setAttribute('aria-current', t[0] === name ? 'page' : 'false');
    });
    var v = M.views[name];
    if (v.onShow) v.onShow(); else if (v.render) v.render();
    if (name === 'accueil') { M.loadAgenda(false); M.school.load(); }
  };

  function build() {
    var views = document.getElementById('views');
    var bar = document.getElementById('tabbar');
    TABS.forEach(function (t) {
      var v = M.views[t[0]];
      v.el = document.createElement('section');
      v.el.className = 'view' + (v.frame ? ' frameview' : '');
      v.el.id = 'view-' + t[0];
      views.appendChild(v.el);
      v.tab = document.createElement('button');
      v.tab.className = 'tab';
      v.tab.innerHTML = '<span class="pill">' + M.icon(t[2], 22) + '</span><span>' + t[1] + '</span>';
      v.tab.onclick = function () { M.go(t[0]); };
      bar.appendChild(v.tab);
    });
  }

  function init() {
    M.loadCfg();
    M.applyAccent();
    HA.loadConfig();
    HA.loadCache();
    build();
    document.getElementById('backdrop').onclick = M.closeSheet;

    HA.onChange(function () {
      var v = M.views[M.current];
      if (v && v.live) v.render();
    });
    HA.onStatus(function () {
      var v = M.views[M.current];
      if (v && v.live) v.render();
    });

    M.go(HA.configured() ? 'accueil' : 'reglages');
    HA.connect();
    M.school.load();
    M.loadAgenda(false);
    M.pellets.refresh();

    setInterval(function () {
      if (document.hidden) return;
      M.school.load();
      M.loadAgenda(false);
      var v = M.views[M.current];
      if (v && v.live) v.render();
    }, 600000);

    // Au retour sur l'app (iOS suspend les connexions), on relance le temps réel
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) return;
      if (HA.configured() && HA.status !== 'connected' && HA.status !== 'polling') HA.reconnect();
      M.school.load();
      M.loadAgenda(false);
      var v = M.views[M.current];
      if (v && v.live) v.render();
    });
    window.addEventListener('pageshow', function (e) { if (e.persisted && HA.configured()) HA.reconnect(); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})(window.M = window.M || {});

</script>
</body>
</html>
